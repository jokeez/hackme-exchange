<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <title>HackMe Exchange — Offline</title>
    <style>
      :root { color-scheme: dark; --bg: #05070d; --text: #e8f4ff; --muted: #7a8ba8; --accent: #4de4ff; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text);
        padding: 2rem;
      }
      .card {
        max-width: 22rem; text-align: center; border: 1px solid rgba(77,228,255,.2);
        border-radius: 1rem; padding: 1.75rem 1.5rem; background: rgba(10,16,32,.85);
      }
      h1 { font-size: 1.15rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.25rem; color: var(--muted); line-height: 1.5; font-size: .92rem; }
      button {
        border: none; border-radius: .55rem; padding: .65rem 1.1rem; cursor: pointer;
        background: linear-gradient(135deg, #4de4ff, #00c073); color: #05070d; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You’re offline</h1>
      <p>HackMe Exchange shell is cached. Reconnect to load live oracle prices and the order book.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
